name: Build Genei AI Android APK

on:
  # Manual only, deliberately.
  #
  # This workflow has failed at "Set up Android SDK" on every run it has ever made, and
  # its path filter matches client/**, server/** and package.json — so it fired on every
  # commit and spent metered private-repository Actions minutes producing a guaranteed
  # failure. Restore the push trigger below once that step actually works.
  #
  #   push:
  #     branches: [main, master]
  #     paths:
  #       - "android/**"
  #       - "client/**"
  #       - "server/**"
  #       - "shared/**"
  #       - "capacitor.config.ts"
  #       - "package.json"
  #       - "pnpm-lock.yaml"
  #       - ".github/workflows/build-genei-android.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Android build per ref at a time; a superseded run is cancelled rather than billed.
concurrency:
  group: genei-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    # A hung SDK download would otherwise hold a runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and synchronize the shared Genei workspace
        run: pnpm android:sync

      - name: Assemble installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validate APK package and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          file "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$apk" | tee /tmp/genei-apk-badging.txt
          grep -q "package: name='ai.genei.creator'" /tmp/genei-apk-badging.txt
          grep -q "Genei AI" /tmp/genei-apk-badging.txt
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload validated Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Genei-AI-Android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
