name: Build Genei AI Desktop for Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Genei AI Desktop artifacts as a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths:
      - "ai_director/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "desktop/**"
      - "packaging/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-genei-runner-windows.yml"
  release:
    types: [published]

permissions:
  contents: write

# One desktop build per ref at a time. A push and a manual dispatch for the same
# commit previously ran concurrently and billed twice for identical work, which is
# exactly how a metered private repository exhausts its included Actions minutes.
concurrency:
  group: genei-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    # Without a ceiling a hung job holds a Windows runner for the 6-hour default.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai_director/requirements.txt"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build embedded hardware sidecar
        shell: pwsh
        run: .\packaging\build_windows_desktop.ps1

      - name: Build the full Genei workspace
        shell: pwsh
        run: pnpm build

      - name: Build the per-user Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Build the portable Windows executable
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: pnpm exec electron-builder --win portable --x64 --publish never

      - name: Build installed layout validation package
        shell: pwsh
        run: pnpm exec electron-builder --win dir --x64 --publish never

      - name: Validate embedded sidecar, installed layout, and desktop artifacts
        shell: pwsh
        run: |
          python .\packaging\validate_windows_exe.py .\runtime\GeneiAI-Director.exe --json
          $installedDir = Join-Path $PWD 'release\win-unpacked'
          $installedExe = Join-Path $installedDir 'GeneiAI.exe'
          $asar = Join-Path $installedDir 'resources\app.asar'
          $unpackedServer = Join-Path $installedDir 'resources\app.asar.unpacked\dist\index.js'
          if (-not (Test-Path $installedExe)) { throw "Installed layout is missing the expected GeneiAI.exe launch target: $installedExe" }
          if (-not (Test-Path $asar)) { throw "Installed layout is missing resources\app.asar." }
          if (-not (Test-Path $unpackedServer)) { throw "Installed layout is missing the unpacked embedded server bundle." }
          python .\packaging\validate_windows_exe.py $installedExe --json
          $installer = @(Get-ChildItem .\release\Genei-AI-Desktop-Setup-*.exe | Where-Object { $_.Name -notlike '*uninstaller*' }) | Select-Object -First 1
          $portable = @(Get-ChildItem .\release\Genei-AI-Desktop-Portable-*.exe) | Select-Object -First 1
          if (-not $installer) { throw "Genei AI Desktop installer was not produced." }
          if (-not $portable) { throw "Genei AI Desktop portable executable was not produced." }
          foreach ($artifact in @($installer, $portable, (Get-Item $installedExe))) {
            if ($artifact.Length -lt 1000000) { throw "$($artifact.Name) is unexpectedly small; refusing to publish a likely incomplete package." }
            Write-Host "Artifact: $($artifact.FullName) ($($artifact.Length) bytes)"
          }

      - name: Smoke test the installed embedded workspace
        shell: pwsh
        run: .\packaging\smoke_windows_desktop.ps1 -InstalledDir (Join-Path $PWD 'release\\win-unpacked')

      # Reads the actual Authenticode signature off the binaries. A certificate being
      # present in the secrets is not evidence that signing worked, so this checks the
      # file and fails the build if signing was expected but did not happen.
      - name: Verify Authenticode signature
        id: signature
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $arguments = @("-Path", ".\release", "-AsJson")
          if ($env:CSC_LINK) { $arguments += "-ExpectSigned" }
          $report = & .\packaging\verify_signature.ps1 @arguments | Out-String
          $report | Out-File -Encoding utf8 .\release\signature-report.json
          "report=release/signature-report.json" >> $env:GITHUB_OUTPUT

      - name: Finalize checksums and metadata
        id: metadata
        shell: pwsh
        run: |
          $pkg = Get-Content .\package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $installer = @(Get-ChildItem .\release\Genei-AI-Desktop-Setup-*.exe | Where-Object { $_.Name -notlike '*uninstaller*' }) | Select-Object -First 1
          $portable = @(Get-ChildItem .\release\Genei-AI-Desktop-Portable-*.exe) | Select-Object -First 1
          $entries = @(
            @{ kind = 'installer'; file = $installer },
            @{ kind = 'portable'; file = $portable }
          )
          $signatureReport = if (Test-Path .\release\signature-report.json) {
            @(Get-Content .\release\signature-report.json -Raw | ConvertFrom-Json)
          } else { @() }

          $artifacts = foreach ($entry in $entries) {
            $artifact = $entry.file
            $report = $signatureReport | Where-Object { $_.artifact -eq $artifact.Name } | Select-Object -First 1
            $signatureState = if ($report) { $report.signingState } else { 'unverified' }
            $signerSubject = if ($report) { $report.signerSubject } else { $null }
            $signatureVerified = [bool]$report
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)" | Out-File -Encoding ascii (Join-Path $artifact.DirectoryName "$($artifact.Name).sha256")
            [ordered]@{
              kind = $entry.kind
              product = 'Genei AI Desktop'
              version = $version
              target = 'win-x64'
              artifact = $artifact.Name
              fileSizeBytes = $artifact.Length
              sha256 = $hash
              signingState = $signatureState
              signerSubject = $signerSubject
              signatureVerified = $signatureVerified
              runnerRequired = $false
              hardwareDetection = 'embedded'
              workflowRun = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              commit = "${{ github.sha }}"
            }
            Write-Host "$($entry.kind) SHA-256: $hash"
          }
          $artifacts | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 .\release\Genei-AI-Desktop.metadata.json
          "tag=genei-desktop-v$version" >> $env:GITHUB_OUTPUT

      # Artifact storage is a convenience, not the delivery channel: hitting the
      # account artifact-storage quota must not stop the verified installer from
      # being published as a release asset. The publish step below still fails
      # when the expected files are missing (fail_on_unmatched_files: true).
      - name: Upload verified desktop artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 1
        with:
          name: Genei-AI-Desktop-Windows-x64-${{ github.run_number }}
          path: |
            release/Genei-AI-Desktop-Setup-*.exe
            release/Genei-AI-Desktop-Setup-*.exe.sha256
            release/Genei-AI-Desktop-Portable-*.exe
            release/Genei-AI-Desktop-Portable-*.exe.sha256
            release/Genei-AI-Desktop.metadata.json
          if-no-files-found: error

      - name: Publish verified GitHub Release assets
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          files: |
            release/Genei-AI-Desktop-Setup-*.exe
            release/Genei-AI-Desktop-Setup-*.exe.sha256
            release/Genei-AI-Desktop-Portable-*.exe
            release/Genei-AI-Desktop-Portable-*.exe.sha256
            release/Genei-AI-Desktop.metadata.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
