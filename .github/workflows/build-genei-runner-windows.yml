name: Build Genei AI Desktop for Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Genei AI Desktop installer as a GitHub Release asset
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths:
      - "ai_director/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "desktop/**"
      - "packaging/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-genei-runner-windows.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai_director/requirements.txt"

      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build embedded hardware sidecar
        shell: pwsh
        run: .\packaging\build_windows_desktop.ps1

      - name: Build the full Genei workspace
        shell: pwsh
        run: pnpm build

      - name: Build the one-click Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Validate embedded sidecar PE and installer output
        shell: pwsh
        run: |
          python .\packaging\validate_windows_exe.py .\runtime\GeneiAI-Director.exe --json
          $installer = Get-ChildItem .\release\Genei-AI-Desktop-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Genei AI Desktop installer was not produced." }
          if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small; refusing to publish a likely incomplete package." }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Finalize checksum and metadata
        id: metadata
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $installer = Get-ChildItem .\release\Genei-AI-Desktop-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii (Join-Path $installer.DirectoryName "$($installer.Name).sha256")
          $tag = "genei-desktop-v1.1.${{ github.run_number }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $metadata = [ordered]@{
            product = "Genei AI Desktop"
            version = "1.1.${{ github.run_number }}"
            target = "win-x64"
            artifact = $installer.Name
            fileSizeBytes = $installer.Length
            sha256 = $hash
            signingState = if ($env:WINDOWS_SIGNING_CERT_BASE64) { "signed" } else { "unsigned" }
            runnerRequired = $false
            hardwareDetection = "embedded"
            workflowRun = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit = "${{ github.sha }}"
          }
          $metadata | ConvertTo-Json | Out-File -Encoding utf8 (Join-Path $installer.DirectoryName "Genei-AI-Desktop.metadata.json")
          Write-Host "SHA-256: $hash"

      - name: Upload verified desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Genei-AI-Desktop-Windows-x64-${{ github.run_number }}
          path: |
            release/Genei-AI-Desktop-Setup-*.exe
            release/Genei-AI-Desktop-Setup-*.exe.sha256
            release/Genei-AI-Desktop.metadata.json
          if-no-files-found: error

      - name: Publish verified GitHub Release asset
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          files: |
            release/Genei-AI-Desktop-Setup-*.exe
            release/Genei-AI-Desktop-Setup-*.exe.sha256
            release/Genei-AI-Desktop.metadata.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
