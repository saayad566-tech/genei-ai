name: Build Genei BYOH Windows Runner

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified runner as a GitHub Release asset
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    paths:
      - "ai_director/**"
      - "packaging/**"
      - ".github/workflows/build-genei-runner-windows.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $tag = "genei-runner-v1.0.${{ github.run_number }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "artifact_name=GeneiRunner-$tag-Windows-x64" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai_director/requirements.txt"

      - name: Build standalone Windows runner
        shell: pwsh
        run: .\packaging\build_windows_exe.ps1

      - name: Validate PE metadata and runner help
        shell: pwsh
        run: |
          python .\packaging\validate_windows_exe.py .\dist\GeneiRunner.exe --json
          & .\dist\GeneiRunner.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "GeneiRunner.exe --help failed with exit code $LASTEXITCODE"
          }

      - name: Optional Windows code signing
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "genei-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          & signtool sign /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 .\dist\GeneiRunner.exe
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Finalize checksum and metadata
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $exe = Get-Item .\dist\GeneiRunner.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File -Encoding ascii .\dist\GeneiRunner.exe.sha256
          $signed = [bool]$env:WINDOWS_SIGNING_CERT_BASE64
          $metadata = [ordered]@{
            name = "Genei BYOH Windows Runner"
            version = "${{ steps.version.outputs.tag }}"
            product = "Genei AI"
            target = "win-x64"
            artifact = $exe.Name
            fileSizeBytes = $exe.Length
            sha256 = $hash
            signingState = if ($signed) { "signed" } else { "unsigned" }
            workflowRun = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit = "${{ github.sha }}"
          }
          $metadata | ConvertTo-Json | Out-File -Encoding utf8 .\dist\GeneiRunner.metadata.json
          Write-Host "SHA-256: $hash"

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/GeneiRunner.exe
            dist/GeneiRunner.exe.sha256
            dist/GeneiRunner.metadata.json
          if-no-files-found: error

      - name: Publish verified GitHub Release asset
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/GeneiRunner.exe
            dist/GeneiRunner.exe.sha256
            dist/GeneiRunner.metadata.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
